<div class="preset_analyzer_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Preset Analyzer</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <!-- Phase Toggles -->
            <div class="flex-container flexFlowColumn">
                <label class="checkbox_label" for="pa_cross_prompt_enabled">
                    <input id="pa_cross_prompt_enabled" type="checkbox" checked />
                    <span>Cross-Prompt Analysis (Phase 2)</span>
                </label>
                <label class="checkbox_label" for="pa_individual_enabled">
                    <input id="pa_individual_enabled" type="checkbox" checked />
                    <span>Individual Prompt Analysis (Phase 1)</span>
                </label>
            </div>

            <!-- Analysis Prompts (collapsible) -->
            <div class="inline-drawer">
                <div class="inline-drawer-toggle inline-drawer-header">
                    <b>Analysis Prompts</b>
                    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
                </div>
                <div class="inline-drawer-content">
                    <small class="pa_prompt_hint">Edit prompts below or use Reset to restore defaults. The JSON schema instruction is appended automatically.</small>

                    <div class="pa_prompt_group">
                        <label for="pa_custom_cross_prompt"><b>Cross-Prompt System Prompt</b></label>
                        <textarea id="pa_custom_cross_prompt" class="text_pole pa_prompt_editor" rows="6"></textarea>
                        <button id="pa_reset_cross_prompt" class="menu_button pa_reset_btn" title="Reset to default">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>Reset to Default</span>
                        </button>
                    </div>

                    <div class="pa_prompt_group">
                        <label for="pa_custom_individual_prompt"><b>Individual System Prompt</b></label>
                        <textarea id="pa_custom_individual_prompt" class="text_pole pa_prompt_editor" rows="6"></textarea>
                        <button id="pa_reset_individual_prompt" class="menu_button pa_reset_btn" title="Reset to default">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>Reset to Default</span>
                        </button>
                    </div>

                    <div class="pa_prompt_group">
                        <label for="pa_custom_followup_prompt"><b>Follow-Up System Prompt</b></label>
                        <textarea id="pa_custom_followup_prompt" class="text_pole pa_prompt_editor" rows="6"></textarea>
                        <button id="pa_reset_followup_prompt" class="menu_button pa_reset_btn" title="Reset to default">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>Reset to Default</span>
                        </button>
                    </div>
                </div>
            </div>

            <hr />

            <!-- Cross-Prompt Analysis -->
            <div id="pa_cross_prompt_section">
                <div class="flex-container">
                    <button id="pa_run_cross_prompt" class="menu_button">
                        <i class="fa-solid fa-magnifying-glass-chart"></i>
                        <span>Run Cross-Prompt Analysis</span>
                    </button>
                </div>
            </div>

            <!-- Individual Prompt Analysis -->
            <div id="pa_individual_section">
                <div class="flex-container">
                    <select id="pa_prompt_select" class="text_pole">
                        <option value="" disabled selected>Select a prompt...</option>
                        <option value="__all__">Analyze All Prompts</option>
                    </select>
                </div>
                <!-- Context Prompts Checklist -->
                <div id="pa_context_prompts" class="pa_context_prompts" style="display: none;">
                    <div class="pa_context_header">
                        <small>Include as context (not analyzed):</small>
                        <button id="pa_auto_detect_context" class="menu_button pa_auto_detect_btn">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>Auto-Detect Related</span>
                        </button>
                    </div>
                    <div id="pa_context_list" class="pa_context_list"></div>
                </div>
                <div class="flex-container">
                    <button id="pa_run_individual" class="menu_button">
                        <i class="fa-solid fa-microscope"></i>
                        <span>Run Individual Analysis</span>
                    </button>
                </div>
            </div>

            <hr />

            <!-- Progress Indicator -->
            <div id="pa_progress" class="pa_progress" style="display: none;">
                <div class="pa_progress_spinner">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                </div>
                <span id="pa_progress_text">Analyzing...</span>
            </div>

            <!-- Results Container -->
            <div id="pa_results" class="pa_results"></div>
        </div>
    </div>
</div>
